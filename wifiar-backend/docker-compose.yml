services:
  db:
    image: postgis/postgis:16-3.4
    container_name: wifiar-postgis
    environment:
      POSTGRES_USER: wifiar
      POSTGRES_PASSWORD: wifiar
      POSTGRES_DB: wifiar
    ports:
      - "5432:5432"
    volumes:
      - wifiar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wifiar -d wifiar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wifiar_pgdata:
